<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 38 38" version="1.1">
  <title>Playstation keyboard-key-frame-e132: custom controller prompt</title>
  <desc>Editable vector companion to the port-authored Xbox masters. Preserves the original canvas and control placement; uses PlayStation symbols and labels. No embedded bitmap, external font, filter or recovered Sony artwork.</desc>
  <defs>
    <mask id="key-opacity" maskUnits="userSpaceOnUse" x="0" y="0" width="38" height="38">
      <rect width="38" height="38" fill="black" />
      <rect id="key-face" width="38" height="38" fill="#333333" />
      <path id="bevel-top" d="M0 0 H38 L32.0 7.0 H7.0 Z" fill="#444444" />
      <path id="bevel-left" d="M0 0 H1.8 V38 H0 Z" fill="#444444" />
      <path id="bevel-right" d="M38 0 V38 L32.0 32.0 V6.0 Z" fill="#777777" />
      <path id="bevel-bottom" d="M1.8 36.0 H32.0 L38 38 H1.8 Z" fill="#777777" />
      <path id="top-edge" d="M1.8 1.0 H38" fill="none" stroke="#888888" stroke-width="2.0" />
      <path id="right-edge" d="M37.0 0 V37.0" fill="none" stroke="#bbbbbb" stroke-width="2.0" />
      <path id="lower-edge" d="M1.8 37.5 H32.0" fill="none" stroke="#444444" stroke-width="1.0" />
    </mask>
  </defs>
  <rect id="key-paint" width="38" height="38" fill="#6699cc" mask="url(#key-opacity)" />
</svg>