<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="72" viewBox="0 0 16 18" version="1.1">
  <title>Playstation right-stick: custom controller prompt</title>
  <desc>Editable vector companion to the port-authored Xbox masters. Preserves the original canvas and control placement; uses PlayStation symbols and labels. No embedded bitmap, external font, filter or recovered Sony artwork.</desc>
  <defs>
    <clipPath id="sphere-edge">
      <ellipse cx="8" cy="10" rx="7.9" ry="7.9" />
    </clipPath>
    <linearGradient id="sphere-rim" gradientUnits="userSpaceOnUse" x1="2" x2="14" y1="2" y2="18">
      <stop offset="0" stop-color="#c9c9c9" />
      <stop offset="0.3" stop-color="#464646" />
      <stop offset="0.6" stop-color="#222222" />
      <stop offset="0.85" stop-color="#000000" />
      <stop offset="1" stop-color="#323232" />
    </linearGradient>
    <radialGradient id="sphere-body" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(5 6) scale(11 11)">
      <stop offset="0" stop-color="#363636" />
      <stop offset="0.35" stop-color="#2f2f2f" />
      <stop offset="0.8" stop-color="#4e4e4e" />
      <stop offset="1" stop-color="#838383" />
    </radialGradient>
    <radialGradient id="sphere-reflection" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(5.3 5.8) scale(3.2 4.4)">
      <stop offset="0" stop-opacity="1" stop-color="#454545" />
      <stop offset="0.35" stop-opacity="0.9" stop-color="#454545" />
      <stop offset="1" stop-opacity="0" stop-color="#454545" />
    </radialGradient>
    <radialGradient id="lower-reflection" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(10 12) scale(4.5 4.5)">
      <stop offset="0" stop-opacity="1" stop-color="#878787" />
      <stop offset="0.35" stop-opacity="0.9" stop-color="#878787" />
      <stop offset="1" stop-opacity="0" stop-color="#878787" />
    </radialGradient>
  </defs>
  <g transform="scale(1.00000000 1.00000000)" id="legacy-metal-button" clip-path="url(#sphere-edge)">
    <ellipse id="outer-rim" cx="8" cy="10" rx="7.7" ry="7.7" fill="url(#sphere-rim)" />
    <ellipse id="sphere-face" cx="7.8" cy="9.6" rx="6.65" ry="6.65" fill="url(#sphere-body)" />
    <ellipse id="reflection" cx="5.3" cy="5.8" rx="3.2" ry="4.4" fill="url(#sphere-reflection)" />
    <ellipse id="lower-reflection" cx="10" cy="12" rx="4.5" ry="4.5" fill="url(#lower-reflection)" />
    <path id="inner-ring-highlight" d="M2.1 11 C1.6 5.9 5.6 3.3 11 3.8" fill="none" stroke="url(#sphere-rim)" stroke-width=".9" />
    <g id="label-r" transform="translate(6 6) scale(0.6)" fill="#edf3fc" fill-rule="evenodd">
      <path d="M0 0 H4.4 C6.5 0 7.2 1.2 7.2 3 C7.2 4.4 6.5 5.3 5.2 5.5 L7.7 10 H5.9 L3.5 5.8 H1.5 V10 H0 Z M1.5 1.4 V4.4 H4.1 C5.3 4.4 5.7 4 5.7 2.9 C5.7 1.9 5.2 1.4 4.1 1.4 Z" transform="translate(0.0 0)" />
    </g>
  </g>
</svg>