<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="88" height="100" viewBox="0 0 22 25" version="1.1">
  <title>Xbox a: custom controller prompt</title>
  <desc>Editable vector companion to the port-authored Xbox masters. Preserves the original canvas and control placement; uses PlayStation symbols and labels. No embedded bitmap, external font, filter or recovered Sony artwork.</desc>
  <defs>
    <clipPath id="button-edge">
      <circle cx="16" cy="20" r="15.95" />
    </clipPath>
    <linearGradient id="button-body-paint" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="4" y2="36">
      <stop offset="0" stop-color="#6ba752" />
      <stop offset="0.22" stop-color="#659c60" />
      <stop offset="0.52" stop-color="#30862d" />
      <stop offset="0.78" stop-color="#43993b" />
      <stop offset="1" stop-color="#5cce5d" />
    </linearGradient>
    <linearGradient id="button-rim-paint" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="4" y2="36">
      <stop offset="0" stop-color="#000000" />
      <stop offset="0.4" stop-color="#4cab3b" />
      <stop offset="1" stop-color="#98d29a" />
    </linearGradient>
    <radialGradient id="top-sheen-paint" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(15.4 6.5) scale(11.9 6.2)">
      <stop offset="0" stop-opacity="1" stop-color="#d0e1cf" />
      <stop offset="0.35" stop-opacity="0.9" stop-color="#d0e1cf" />
      <stop offset="1" stop-opacity="0" stop-color="#d0e1cf" />
    </radialGradient>
    <radialGradient id="left-reflection-paint" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(4.9 17) scale(2.4 8.5)">
      <stop offset="0" stop-opacity="1" stop-color="#499743" />
      <stop offset="0.35" stop-opacity="0.9" stop-color="#499743" />
      <stop offset="1" stop-opacity="0" stop-color="#499743" />
    </radialGradient>
    <linearGradient id="letter-shadow-paint" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="10" y2="30">
      <stop offset="0" stop-color="#2f3e22" />
      <stop offset="1" stop-color="#35833b" />
    </linearGradient>
    <linearGradient id="letter-bevel-paint" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="10" y2="30">
      <stop offset="0" stop-color="#81ce7d" />
      <stop offset="1" stop-color="#beffb8" />
    </linearGradient>
    <linearGradient id="letter-face-paint" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="10" y2="29">
      <stop offset="0" stop-color="#edffed" />
      <stop offset="0.5" stop-color="#bdfcba" />
      <stop offset="1" stop-color="#d0ffd0" />
    </linearGradient>
  </defs>
  <g id="face-button" transform="translate(0.0 0.25) scale(0.6875)" clip-path="url(#button-edge)">
    <circle id="button-body" cx="16" cy="20" r="15.7" fill="url(#button-body-paint)" stroke="url(#button-rim-paint)" stroke-width=".5" />
    <ellipse id="top-sheen" cx="15.4" cy="6.5" rx="11.9" ry="6.2" fill="url(#top-sheen-paint)" />
    <ellipse id="left-reflection" cx="4.9" cy="17" rx="2.4" ry="8.5" fill="url(#left-reflection-paint)" />
    <path id="letter-raised-shadow" d="M12.5 10 H19.1 L25.8 28 H21 L19.9 25.6 H10.7 L9.6 28 H5.9 Z M15.7 14.7 L12.9 22 H18.6 Z" fill="url(#letter-shadow-paint)" stroke="url(#letter-shadow-paint)" stroke-width="1.65" stroke-linejoin="round" fill-rule="evenodd" transform="translate(.3 .7)" />
    <path id="letter-bevel" d="M12.5 10 H19.1 L25.8 28 H21 L19.9 25.6 H10.7 L9.6 28 H5.9 Z M15.7 14.7 L12.9 22 H18.6 Z" fill="url(#letter-bevel-paint)" stroke="url(#letter-bevel-paint)" stroke-width=".7" stroke-linejoin="round" fill-rule="evenodd" />
    <path id="letter-face" d="M12.5 10 H19.1 L25.8 28 H21 L19.9 25.6 H10.7 L9.6 28 H5.9 Z M15.7 14.7 L12.9 22 H18.6 Z" fill="url(#letter-face-paint)" fill-rule="evenodd" />
  </g>
</svg>