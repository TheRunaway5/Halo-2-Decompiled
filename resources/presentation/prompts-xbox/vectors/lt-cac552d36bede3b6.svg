<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="68" height="72" viewBox="0 0 17 18" version="1.1">
  <title>Xbox lt: custom controller prompt</title>
  <desc>Editable vector companion to the port-authored Xbox masters. Preserves the original canvas and control placement; uses PlayStation symbols and labels. No embedded bitmap, external font, filter or recovered Sony artwork.</desc>
  <defs>
    <linearGradient id="button-body" gradientUnits="userSpaceOnUse" x1="0" x2="17" y1="0" y2="0">
      <stop offset="0" stop-color="#000000" />
      <stop offset="1" stop-color="#6b6b6b" />
    </linearGradient>
    <linearGradient id="button-edge" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="2" y2="18">
      <stop offset="0" stop-color="#171515" />
      <stop offset="1" stop-color="#181616" />
    </linearGradient>
  </defs>
  <g transform="scale(1.00000000 1.00000000)" id="legacy-shoulder-letter">
    <g transform="translate(0 0)">
      <path id="body" d="M16 2 H8 C3 2 .5 5 .5 10 C.5 15 3 17.5 8 17.5 H16 Z" fill="url(#button-body)" stroke="url(#button-edge)" stroke-width=".6" />
    </g>
    <path id="letter-L" d="M8 5 H10 V13 H14 V15 H8 Z" fill-rule="evenodd" fill="#bbbbbb" />
  </g>
</svg>