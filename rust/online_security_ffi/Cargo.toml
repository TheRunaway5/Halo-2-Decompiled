[package]
name = "halo2-online-security-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[features]
matchmaking-test-inputs = ["halo2-online-protocol/matchmaking-test-inputs"]

[lib]
crate-type = ["cdylib"]

[dependencies]
halo2-online-protocol = { path = "../online_protocol" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
overflow-checks = true
