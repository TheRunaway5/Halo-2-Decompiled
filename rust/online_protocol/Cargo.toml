[package]
name = "halo2-online-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.2.16"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
serde_json = "=1.0.149"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true

