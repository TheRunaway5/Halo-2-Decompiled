[package]
name = "halo2-online-protocol-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
halo2-online-protocol = { path = "../online_protocol" }
cxx = "=1.0.205"
keyring = "=4.2.0"
sha2 = "=0.10.9"
curl = { version = "=0.4.50", default-features = false, features = ["ssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"

[build-dependencies]
cxx-build = "=1.0.205"

[lints.rust]
unsafe_code = "deny"

[profile.release]
overflow-checks = true

